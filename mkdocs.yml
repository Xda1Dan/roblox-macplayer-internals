site_name: Roblox macOS Player Internals
site_description: "Reverse-engineering notes for the Roblox macOS player (build 0.742.0.7421053): scripting, scheduler, networking, replication, and the patched Luau VM."
site_url: https://Xda1Dan.github.io/roblox-macplayer-internals/
repo_name: Xda1Dan/roblox-macplayer-internals
repo_url: https://github.com/Xda1Dan/roblox-macplayer-internals
edit_uri: edit/master/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - announce.dismiss
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github
    logo: material/console-line

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Overview: overview.md
  - Scripting and the VM:
      - Script execution: script-execution.md
      - Luau scripting: scripting-luau.md
      - Luau VM lifecycle: luau-vm-lifecycle.md
      - Luau VM encodings: luau-vm-encodings.md
  - Scheduler:
      - Job scheduler: job-scheduler.md
      - Scheduler internals: scheduler-internals.md
  - Networking:
      - Replication: replication-net.md
      - Deserialize path: replication-deserialize.md
  - Engine:
      - DataModel: datamodel.md
      - Objective-C bridge: objc-bridge.md
  - Reference:
      - Examples: examples.md
      - Evidence and limits: evidence-ledger.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: "!!python/name:pymdownx.superfences.fence_code_format"
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
